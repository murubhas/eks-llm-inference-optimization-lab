apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: qwen36-g7-pp2-a-master
      namespace: model-serving
      labels:
        app: qwen36-g7-pp2
        replica-group: a
        component: master
    spec:
      clusterIP: None
      publishNotReadyAddresses: true
      selector:
        app: qwen36-g7-pp2
        replica-group: a
        role: head
      ports:
        - name: master
          port: 29500
          targetPort: 29500
  - apiVersion: v1
    kind: Service
    metadata:
      name: qwen36-g7-pp2-b-master
      namespace: model-serving
      labels:
        app: qwen36-g7-pp2
        replica-group: b
        component: master
    spec:
      clusterIP: None
      publishNotReadyAddresses: true
      selector:
        app: qwen36-g7-pp2
        replica-group: b
        role: head
      ports:
        - name: master
          port: 29500
          targetPort: 29500
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: qwen36-g7-pp2-a-r0
      namespace: model-serving
      labels: &pp2-a-r0-labels
        app: qwen36-g7-pp2
        experiment: qwen36-g7-tp-comparison
        topology: pp2
        replica-group: a
        role: head
        rank: "0"
    spec:
      replicas: 1
      progressDeadlineSeconds: 3600
      strategy:
        type: Recreate
      selector:
        matchLabels: *pp2-a-r0-labels
      template:
        metadata:
          labels: *pp2-a-r0-labels
        spec: &pp2-pod-spec
          serviceAccountName: model-artifact-reader
          terminationGracePeriodSeconds: 60
          nodeSelector:
            node.kubernetes.io/instance-type: g7.2xlarge
            workload: inference-g7-2xlarge-tp
            gpu-stack: gpu-operator
            experiment: tensor-parallel
          tolerations:
            - key: workload
              operator: Equal
              value: inference-g7-2xlarge-tp
              effect: NoSchedule
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: experiment
                        operator: In
                        values: [qwen36-g7-tp-comparison]
                      - key: topology
                        operator: In
                        values: [pp2]
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: vllm
              image: YOUR_REGISTRY.example.com/vllm-openai:vllm-0.24.0-lmcache
              imagePullPolicy: IfNotPresent
              command: [/bin/bash, /opt/g7-tp/launch.sh]
              env: &pp2-a-r0-env
                - name: TP_SIZE
                  value: "1"
                - name: PP_SIZE
                  value: "2"
                - name: MAX_NUM_SEQS
                  value: "1"
                - name: SERVED_MODEL_NAME
                  value: qwen36-27b-all1000-fp8-g7-pp2-benchmark
                - name: NNODES
                  value: "2"
                - name: NODE_RANK
                  value: "0"
                - name: HEADLESS
                  value: "false"
                - name: MASTER_ADDR
                  value: qwen36-g7-pp2-a-master.model-serving.svc.cluster.local
                - name: MASTER_PORT
                  value: "29500"
                - name: VLLM_HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: NCCL_SOCKET_FAMILY
                  value: AF_INET
                - name: NCCL_DEBUG
                  value: INFO
                - name: VLLM_LOGGING_LEVEL
                  value: INFO
                - name: VLLM_LOG_STATS_INTERVAL
                  value: "10"
                - name: PYTHONHASHSEED
                  value: "123"
              ports:
                - name: http
                  containerPort: 8000
                - name: master
                  containerPort: 29500
              startupProbe:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 600
              readinessProbe:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              resources:
                requests:
                  cpu: "2"
                  memory: 20Gi
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: launcher
                  mountPath: /opt/g7-tp
                  readOnly: true
                - name: model-storage
                  mountPath: /models
                  readOnly: true
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: launcher
              configMap:
                name: qwen36-g7-tp-launcher
                defaultMode: 0555
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-pvc
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
