      template:
        metadata:
          labels: *tp4-r2-labels
        spec:
          <<: *tp4-pod-spec
          containers:
            - <<: *tp4-worker-container
              env:
                - name: TP_SIZE
                  value: "4"
                - name: NNODES
                  value: "4"
                - name: NODE_RANK
                  value: "2"
                - name: HEADLESS
                  value: "true"
                - name: MASTER_ADDR
                  value: qwen36-g7-tp4-master.model-serving.svc.cluster.local
                - name: MASTER_PORT
                  value: "29500"
                - name: VLLM_HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: NCCL_SOCKET_FAMILY
                  value: AF_INET
                - name: NCCL_DEBUG
                  value: INFO
                - name: VLLM_LOGGING_LEVEL
                  value: INFO
                - name: VLLM_LOG_STATS_INTERVAL
                  value: "10"
                - name: PYTHONHASHSEED
                  value: "123"
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: qwen36-g7-tp4-r3
      namespace: model-serving
      labels: &tp4-r3-labels
        app: qwen36-g7-tp4
        experiment: qwen36-g7-tp-comparison
        topology: tp4
        replica-group: a
        role: worker
        rank: "3"
    spec:
      replicas: 1
      progressDeadlineSeconds: 3600
      strategy:
        type: Recreate
      selector:
        matchLabels: *tp4-r3-labels
      template:
        metadata:
          labels: *tp4-r3-labels
        spec:
          <<: *tp4-pod-spec
          containers:
            - <<: *tp4-worker-container
              env:
                - name: TP_SIZE
                  value: "4"
                - name: NNODES
                  value: "4"
                - name: NODE_RANK
                  value: "3"
                - name: HEADLESS
                  value: "true"
                - name: MASTER_ADDR
                  value: qwen36-g7-tp4-master.model-serving.svc.cluster.local
                - name: MASTER_PORT
                  value: "29500"
                - name: VLLM_HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: NCCL_SOCKET_FAMILY
                  value: AF_INET
                - name: NCCL_DEBUG
                  value: INFO
                - name: VLLM_LOGGING_LEVEL
                  value: INFO
                - name: VLLM_LOG_STATS_INTERVAL
                  value: "10"
                - name: PYTHONHASHSEED
                  value: "123"
  - apiVersion: v1
    kind: Service
    metadata:
      name: qwen36-g7-tp4
      namespace: model-serving
      labels:
        app: qwen36-g7-tp4
        component: api
        experiment: qwen36-g7-tp-comparison
    spec:
      selector:
        app: qwen36-g7-tp4
        topology: tp4
        role: head
      ports:
        - name: http
          port: 80
          targetPort: http
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: qwen36-g7-tp4
      namespace: model-serving
      labels:
        release: kube-prometheus-stack
    spec:
      selector:
        matchLabels:
          app: qwen36-g7-tp4
          component: api
      namespaceSelector:
        matchNames: [model-serving]
      endpoints:
        - port: http
          path: /metrics
          interval: 15s
