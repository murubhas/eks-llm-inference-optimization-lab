apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen36-g7-tp-launcher
  namespace: model-serving
  labels:
    experiment: qwen36-g7-tp-comparison
data:
  launch.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${TP_SIZE:?TP_SIZE is required}"
    : "${NNODES:?NNODES is required}"
    : "${NODE_RANK:?NODE_RANK is required}"
    : "${MASTER_ADDR:?MASTER_ADDR is required}"

    MODEL_PATH="/models/qwen3.6-27b-fp8"
    PP_SIZE="${PP_SIZE:-1}"
    MAX_NUM_SEQS="${MAX_NUM_SEQS:-1}"
    SERVED_MODEL="${SERVED_MODEL_NAME:-qwen36-27b-all1000-fp8-g7-tp-benchmark}"

    python3 - <<'PY'
    import json
    import os
    import sys
    import vllm

    root = "/models/qwen3.6-27b-fp8"
    print("vLLM version:", getattr(vllm, "__version__", "unknown"), flush=True)
    config_path = os.path.join(root, "config.json")
    if not os.path.exists(config_path):
        sys.exit(f"Model config missing: {config_path}")
    with open(config_path, "r", encoding="utf-8") as handle:
        config = json.load(handle)
    print("Model type:", config.get("model_type", "unknown"), flush=True)
    PY

    echo "Starting TP=${TP_SIZE}, PP=${PP_SIZE}, nnodes=${NNODES}, node_rank=${NODE_RANK}, master=${MASTER_ADDR}:${MASTER_PORT:-29500}, headless=${HEADLESS:-false}"

    if [[ "${NODE_RANK}" != "0" ]]; then
      until getent hosts "${MASTER_ADDR}" >/dev/null 2>&1; do
        echo "Waiting for rank-0 DNS: ${MASTER_ADDR}"
        sleep 2
      done
    fi

    args=(
      serve "${MODEL_PATH}"
      --max-model-len 8192
      --tensor-parallel-size "${TP_SIZE}"
      --pipeline-parallel-size "${PP_SIZE}"
      --distributed-executor-backend mp
      --nnodes "${NNODES}"
      --node-rank "${NODE_RANK}"
      --master-addr "${MASTER_ADDR}"
      --master-port "${MASTER_PORT:-29500}"
      --trust-remote-code
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --enable-prefix-caching
      --mamba-cache-mode align
      --limit-mm-per-prompt '{"image":1,"video":0,"audio":0}'
      --generation-config vllm
      --kv-cache-dtype fp8_e4m3
      --async-scheduling
      --enable-chunked-prefill
      --mm-processor-cache-gb 1
      --max-num-seqs "${MAX_NUM_SEQS}"
      --max-num-batched-tokens 3135
      --served-model-name "${SERVED_MODEL}"
      --disable-access-log-for-endpoints /health,/metrics,/ping
      --gpu-memory-utilization 0.90
      --port 8000
    )

    if [[ "${HEADLESS:-false}" == "true" ]]; then
      args+=(--headless)
    fi

    linear_backend="${LINEAR_BACKEND:-auto}"
    if [[ "${linear_backend}" != "auto" ]]; then
      args+=(--linear-backend "${linear_backend}")
    fi

    exec vllm "${args[@]}"
