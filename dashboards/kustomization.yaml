apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
configMapGenerator:
  - name: grafana-dashboard-llm-inference-vllm
    files:
      - llm-gpu-vllm-inference-economics.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: LLM Inference Lab
