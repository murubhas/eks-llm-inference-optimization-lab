apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gpu-vllm-baseline
  namespace: model-serving
  labels:
    app: llm-gpu-vllm-baseline
    app.kubernetes.io/name: llm-gpu-vllm-baseline
    app.kubernetes.io/component: model-server
spec:
  replicas: 4
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: llm-gpu-vllm-baseline
  template:
    metadata:
      labels:
        app: llm-gpu-vllm-baseline
        app.kubernetes.io/name: llm-gpu-vllm-baseline
        app.kubernetes.io/component: model-server
    spec:
      serviceAccountName: REPLACE_WITH_SERVICE_ACCOUNT
      terminationGracePeriodSeconds: 120
      nodeSelector:
        node.kubernetes.io/instance-type: REPLACE_WITH_INSTANCE_TYPE
        workload: REPLACE_WITH_GPU_WORKLOAD_LABEL
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: workload
          operator: Equal
          value: REPLACE_WITH_GPU_WORKLOAD_LABEL
          effect: NoSchedule
      containers:
        - name: vllm
          image: REPLACE_WITH_VLLM_IMAGE
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
          args:
            - |
              set -eu
              python3 - <<'PY'
              import json
              import os
              import sys

              import vllm

              root = os.environ["MODEL_PATH"]
              config_path = os.path.join(root, "config.json")
              print("vLLM version:", getattr(vllm, "__version__", "unknown"))
              print("Model path:", root)
              if not os.path.exists(config_path):
                  sys.exit(f"Model config missing: {config_path}")

              with open(config_path, "r", encoding="utf-8") as handle:
                  config = json.load(handle)

              model_type = config.get("model_type")
              required = []
              if model_type == "gemma4":
                  required = ["preprocessor_config.json", "processor_config.json"]
              elif model_type == "qwen3_5":
                  required = ["preprocessor_config.json", "video_preprocessor_config.json"]
              elif "vision_config" in config:
                  required = ["preprocessor_config.json"]

              missing = [name for name in required if not os.path.exists(os.path.join(root, name))]
              if missing:
                  sys.exit("Missing model sidecars: " + ", ".join(missing))
              PY
              exec vllm serve "${MODEL_PATH}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --max-model-len 8192 \
                --tensor-parallel-size 1 \
                --trust-remote-code \
                --reasoning-parser qwen3 \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --enable-prefix-caching \
                --mamba-cache-mode align \
                --limit-mm-per-prompt '{"image": 1, "video": 0, "audio": 0}' \
                --generation-config vllm \
                --kv-cache-dtype fp8_e4m3 \
                --async-scheduling \
                --enable-chunked-prefill \
                --mm-processor-cache-gb 1 \
                --max-num-seqs 1 \
                --max-num-batched-tokens 3135 \
                --disable-access-log-for-endpoints /health,/metrics,/ping \
                --gpu-memory-utilization 0.90 \
                --port 8000
          env:
            - name: MODEL_PATH
              value: REPLACE_WITH_MODEL_PATH
            - name: SERVED_MODEL_NAME
              value: REPLACE_WITH_MODEL_ID
            - name: PYTHONHASHSEED
              value: "123"
            - name: TZ
              value: UTC
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: VLLM_LOG_STATS_INTERVAL
              value: "10"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 600
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-storage
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: REPLACE_WITH_MODEL_PVC
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
